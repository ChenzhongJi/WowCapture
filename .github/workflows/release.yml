name: release

# 打 tag（v*）时发布：构建自包含单文件 exe，打 zip，创建 GitHub Release。
# 触发示例：git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publish (self-contained single file)
        run: dotnet publish src/WowCapture.App/WowCapture.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Pack
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath WowCapture-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: WowCapture-win-x64.zip
          generate_release_notes: true
